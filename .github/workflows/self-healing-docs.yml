name: Self-Healing Docs Review

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  review-docs:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # Checkout the merged version of the tool itself.
      - name: Checkout tool
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          path: tool

      # Checkout the repository before the PR.
      - name: Checkout old snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: snapshots/old

      # Checkout the repository after the PR was merged.
      - name: Checkout new snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          path: snapshots/new

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: tool
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Review documentation
        working-directory: tool
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_RESULTS_FILE: ${{ runner.temp }}/review_results.json
        run: |
          python -m src.main ../snapshots/old ../snapshots/new

      - name: Read review results
        id: review-results
        run: |
          RESULTS=$(cat "${{ runner.temp }}/review_results.json")

          echo "Review results:"
          echo "$RESULTS"

          {
            echo "results<<EOF"
            echo "$RESULTS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR when AI review fails
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "DEBUG: review results"
          cat "${{ runner.temp }}/review_results.json"

          if jq -e 'any(.[]; .success == false)' "${{ runner.temp }}/review_results.json" > /dev/null; then
            gh pr comment "${{ github.event.pull_request.number }}" --body "$(cat <<'EOF'
          WARNING: **Self-Healing Docs:** AI documentation review was temporarily unavailable.

          The AI service could not complete the documentation review. No documentation changes were made.

          The affected documentation will need to be reviewed again when the AI service is available.
          EOF
          )"
          else
            echo "AI review completed successfully."
          fi

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create documentation branch
        working-directory: snapshots/new
        run: |
          if jq -e 'any(.[]; .updated == true)' "${{ runner.temp }}/review_results.json" > /dev/null; then
            BRANCH="docs/self-healing-${{ github.event.pull_request.number }}"
            git checkout -b "$BRANCH"
            echo "DOCS_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          else
            echo "No documentation updates. Skipping branch creation."
          fi

      - name: Commit documentation updates
        working-directory: snapshots/new
        run: |
          if jq -e 'any(.[]; .updated == true)' "${{ runner.temp }}/review_results.json" > /dev/null; then
            git add .
            git commit -m "docs: update documentation automatically"
          else
            echo "No documentation updates to commit."
          fi

      - name: Push documentation branch
        working-directory: snapshots/new
        run: |
          if jq -e 'any(.[]; .updated == true)' "${{ runner.temp }}/review_results.json" > /dev/null; then
            git push origin "$DOCS_BRANCH"
          else
            echo "No documentation updates to push."
          fi

      - name: Create documentation PR
        working-directory: snapshots/new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if jq -e 'any(.[]; .updated == true)' "${{ runner.temp }}/review_results.json" > /dev/null; then

            UPDATED_SECTIONS=$(jq -r '
              .[]
              | select(.updated == true)
              | "- \(.file) -> \(.heading)"
            ' "${{ runner.temp }}/review_results.json")

            CHANGED_SYMBOLS=$(jq -r '
              .[]
              | select(.updated == true)
              | .changed_symbols[]
              | "- \(.symbol.file)::\(.symbol.name)"
            ' "${{ runner.temp }}/review_results.json")

            gh pr create \
              --base "${{ github.event.pull_request.base.ref }}" \
              --head "$DOCS_BRANCH" \
              --title "docs: update documentation for #${{ github.event.pull_request.number }}" \
              --body "$(cat <<EOF
          ## Self-Healing Docs

          Updated documentation based on changes from #${{ github.event.pull_request.number }}.

          ### Updated sections
          $UPDATED_SECTIONS

          ### Changed symbols
          $CHANGED_SYMBOLS
          EOF
          )"

          else
            echo "No documentation updates. No PR created."
          fi
