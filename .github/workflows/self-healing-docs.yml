# workflow trigger test
name: Self-Healing Docs Review

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  review-docs:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # Checkout the merged version of the tool itself.
      - name: Checkout tool
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          path: tool

      # Checkout the repository before the PR.
      - name: Checkout old snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: snapshots/old

      # Checkout the repository after the PR was merged.
      - name: Checkout new snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          path: snapshots/new

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: tool
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Review documentation
        working-directory: tool
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src.main ../snapshots/old ../snapshots/new